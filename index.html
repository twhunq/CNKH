<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập CNXHKH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&family=Patrick+Hand&display=swap">
<style>
/* Layout: phiếu kiểm tra trên giấy — cột câu hỏi + phiếu tô đáp án bám cạnh; mực xanh của người làm, bút đỏ của người chấm */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#1c2230; --muted:#5b6475; --line:#dde1e8; --soft:#eef1f6;
  --accent:#1f4e9c; --accent-soft:#e3ebf8; --pen:#c4162f; --pen-soft:#fbe7ea; --ok:#1d7a4c; --ok-soft:#e2f3ea;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Patrick Hand", "Comic Sans MS", cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12151b; --sheet:#1a1e26; --ink:#e5e8ef; --muted:#9aa3b4; --line:#2c3240; --soft:#222834;
  --accent:#86a9ff; --accent-soft:#1f2b45; --pen:#ff6f7d; --pen-soft:#3a1f25; --ok:#5fcf95; --ok-soft:#1b3328; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12151b; --sheet:#1a1e26; --ink:#e5e8ef; --muted:#9aa3b4; --line:#2c3240; --soft:#222834;
  --accent:#86a9ff; --accent-soft:#1f2b45; --pen:#ff6f7d; --pen-soft:#3a1f25; --ok:#5fcf95; --ok-soft:#1b3328; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.danger{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn.sm{padding:7px 13px}
.btn.big{width:100%;padding:13px 18px;font-size:16px}
.x{flex:none;display:grid;place-items:center;border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;padding:0 0 2px;color:var(--muted)}
.only-m{display:none}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---------- Home ---------- */
.masthead{display:grid;gap:6px;padding-block:8px 22px;border-bottom:1px solid var(--line);margin-bottom:24px}
.masthead h1{font-size:clamp(26px,4.2vw,38px)}
.masthead p{margin:0;color:var(--muted);max-width:62ch}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lesson{display:grid;gap:8px;align-content:start;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.lesson[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.lesson .num{font-family:var(--f-display);font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
.lesson .name{font-weight:600;line-height:1.4}
.lesson .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.lesson .best{font-family:var(--f-hand);color:var(--pen);font-size:17px;line-height:1}
.lesson .go{color:var(--accent);font-weight:600;font-size:13px}
/* Hộp chọn cấu hình: bottom sheet trên điện thoại, hộp giữa màn hình trên máy tính */
dialog.setup{border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px,calc(100% - 32px));max-width:none;max-height:min(88vh,640px);background:var(--sheet);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.25)}
dialog.setup::backdrop{background:rgba(10,14,22,.45)}
dialog.setup[open]{animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}}
.setup-in{display:grid;gap:18px;padding:18px 20px 20px}
.setup-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.setup-head h2{font-size:20px;margin-top:4px}
.setup-head .best{font-family:var(--f-hand);color:var(--pen);font-size:17px;text-transform:none;letter-spacing:0}
html:has(dialog[open]){overflow:hidden}
@media (max-width:600px){
  dialog.setup{margin:auto 0 0;width:100%;max-height:88vh;border-radius:18px 18px 0 0;border-bottom:0}
  dialog.setup::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  .setup-in{padding:10px 16px max(16px,env(safe-area-inset-bottom,0px))}
  .setup .seg{display:flex}
  .setup .seg button{flex:1 1 auto;padding:9px 12px}
}
.field{display:grid;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hint{color:var(--muted);font-size:13px;margin:0}
details.fixes{margin-top:22px;background:var(--sheet);border:1px dashed var(--pen);border-radius:var(--r);padding:12px 18px}
details.fixes summary{cursor:pointer;font-weight:600;color:var(--pen)}
details.fixes li{margin-block:8px}

/* ---------- Quiz ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .stat{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.progress{height:3px;background:var(--soft)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.main{display:grid;gap:14px;min-width:0}
.endbar{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.endbar .hint{text-align:center}
.qlist{display:grid;gap:14px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;scroll-margin-top:80px}
.q.right{border-color:var(--ok)}
.q.wrong{border-color:var(--pen)}
.qhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.qno{font-family:var(--f-display);font-weight:700;color:var(--accent);white-space:nowrap}
.qtext{font-weight:600;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 9px;margin-left:6px;white-space:nowrap}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--sheet)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.bub{flex:none;width:24px;height:24px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:1px}
.opt.multi .bub{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt input:focus-visible + .bub{outline:2px solid var(--accent);outline-offset:2px}
.opt.is-ans{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ans .bub{border-color:var(--ok);color:var(--ok)}
.opt.sel.is-ans .bub{background:var(--ok);color:var(--sheet)}
.opt.sel.not-ans{border-color:var(--pen);background:var(--pen-soft)}
.opt.sel.not-ans .bub{background:var(--pen);border-color:var(--pen)}
.locked .opt{cursor:default}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
@media (max-width:560px){.part{grid-template-columns:minmax(0,1fr)}}
.part.ok{border-color:var(--ok);background:var(--ok-soft)}
.part.no{border-color:var(--pen);background:var(--pen-soft)}
.tfbtns{display:inline-flex;gap:6px}
.tfbtns button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 14px;font-weight:600}
.tfbtns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.part select{max-width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.fix{font-family:var(--f-hand);color:var(--pen);font-size:18px;line-height:1.3}
.note{margin-top:10px;font-size:13.5px;color:var(--pen);background:var(--pen-soft);border-radius:8px;padding:8px 12px}
.sheetcol{position:sticky;top:76px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scrim{display:none}
/* Điện thoại: phiếu trả lời thành bottom sheet, mở bằng nút "Phiếu" trên thanh trên cùng */
@media (max-width:860px){
  .only-m{display:inline-flex}
  .sheetcol{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;max-height:75vh;border-radius:18px 18px 0 0;border-bottom:0;
    padding:14px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);visibility:hidden;transition:transform .22s ease-out,visibility .22s}
  .sheetcol.open{transform:none;visibility:visible}
  .sheetcol .grid{max-height:none;flex:1 1 auto;min-height:0;overscroll-behavior:contain;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .sheetcol .row .btn{flex:1}
  .scrim.open{display:block;position:fixed;inset:0;z-index:25;background:rgba(10,14,22,.4)}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-block:10px 14px;max-height:46vh;overflow:auto;padding:2px}
.cell{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);border-radius:50%;background:var(--sheet);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);padding:0}
.cell.done{border-color:var(--accent);background:var(--accent);color:var(--sheet)}
.cell.half{border-color:var(--accent);color:var(--accent)}
.cell.r{border-color:var(--ok);background:var(--ok);color:var(--sheet)}
.cell.w{border-color:var(--pen);background:var(--pen);color:var(--sheet)}
.confirm{margin-top:10px;border:1px solid var(--pen);background:var(--pen-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:14px}

/* ---------- Result ---------- */
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:22px}
@media (max-width:560px){.result{grid-template-columns:minmax(0,1fr)}}
.score{width:150px;height:150px;border-radius:50%;border:3px solid var(--pen);display:grid;place-items:center;transform:rotate(-6deg);font-family:var(--f-hand);color:var(--pen);text-align:center;line-height:1}
.score b{font-size:64px;font-weight:400}
.score span{font-size:18px}
.result h2{font-size:24px;margin-bottom:6px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-block:10px 14px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:22px;font-family:var(--f-display)}
.stats small{color:var(--muted)}
.filter{margin-bottom:12px}
.empty{background:var(--ok-soft);color:var(--ok);border-radius:var(--r);padding:16px 18px;font-weight:600}
/* ---------- Theme toggle ---------- */
:root[data-theme="light"]{color-scheme:light}
.theme{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.theme svg{width:20px;height:20px}
.theme .sun{display:none}
.is-dark .theme .sun{display:block}
.is-dark .theme .moon{display:none}
/* ---------- Điện thoại ---------- */
@media (max-width:560px){
  body{font-size:15px}
  .wrap{padding-block:14px 80px}
  .masthead{padding-block:4px 16px;margin-bottom:16px}
  .lessons{gap:10px}
  .lesson{padding:13px 15px;gap:6px}
  .bar .in{flex-wrap:nowrap;gap:8px;padding-block:8px}
  .bar .lbl{display:none}
  .bar .ttl{font-size:15px}
  .bar .stat{font-size:13px;white-space:nowrap}
  .q{padding:14px;scroll-margin-top:68px}
  .opt{padding:11px 12px}
  .tfbtns button{padding:8px 18px}
  .part .row{width:100%}
  .part select{width:100%;font-size:16px;padding:9px 10px}
  .result{padding:18px 16px;gap:16px}
  .score{justify-self:center;width:130px;height:130px}
  .score b{font-size:54px}
  .result .row .btn{flex:1 1 auto}
  .filter{display:flex}
  .filter button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<button class="theme" id="theme" type="button">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>

ời; là một hình thái tổ chức nhà nước thừa nhận quyền làm chủ của nhân dân; là một giá trị xã hội phản ánh sự nghiệp đấu tranh của con người","Dân chủ là giá trị phản ánh quyền cơ bản của con người; là kết quả của sự nghiệp đấu tranh của con người vì lợi ích của con người","Dân chủ là một giá trị xã hội phản ánh sự nghiệp đấu tranh của con người vì sự phát triển tiến bộ xã hội"],"a":[0]},{"id":"b3-25","l":3,"t":"single","q":"So với các mô hình nhà nước khác trong lịch sử thì nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam có sự khác biệt về chất như thế nào?","o":["Mang bản chất của giai cấp công nhân, tính nhân dân rộng rãi và tính dân tộc sâu sắc","Vừa mang bản chất của giai cấp công nhân và nhân dân lao động","Mang bản chất của đa số nhân dân lao động","Mang bản chất của giai cấp công nhân"],"a":[0]},{"id":"b3-26","l":3,"t":"single","q":"Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam có đặc điểm như thế nào?","o":["Nhà nước hình thành là kết quả của cách mạng xã hội chủ nghĩa","Nhà nước đặt dưới sự lãnh đạo của Đảng cộng sản","Nhà nước hoạt động trên nền tảng của khối liên minh công – nông – trí thức","Nhà nước được tổ chức và hoạt động trên cơ sở Hiến pháp và pháp luật"],"a":[3]},{"id":"b3-27","l":3,"t":"single","q":"Bản chất chính trị của nền dân chủ xã hội chủ nghĩa thể hiện như thế nào?","o":["Nhà nước chủ yếu thực hiện các quyết định chính trị mà không cần sự đồng thuận hoặc tham gia của người dân.","Quyền lực thuộc về một cá nhân duy nhất, không có sự tham gia của quần chúng nhân dân.","Quyền lực và lợi ích thuộc về toàn thể nhân dân lao động, trong đó có giai cấp công nhân, dưới sự lãnh đạo của Đảng Cộng sản","Nền dân chủ tập trung vào phát triển kinh tế tư nhân và bảo vệ lợi ích của tầng lớp giàu có."],"a":[2]},{"id":"b3-28","l":3,"t":"match","q":"Chọn cụm từ thích hợp điền vào chỗ trống trong từng phát biểu:","s":["Hình thức ……… là hình thức dân chủ đại diện, được thực hiện do nhân dân \"ủy quyền\", giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra.","Hình thức ……… là hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội.","Chế độ ……… ở nước ta được xác lập sau Cách mạng Tháng Tám năm 1945."],"b":["xã hội chủ nghĩa","dân chủ trực tiếp","dân chủ nhân dân","dân chủ gián tiếp"],"a":[3,1,2]},{"id":"b3-29","l":3,"t":"match","q":"Chọn cụm từ thích hợp điền vào chỗ trống trong từng phát biểu:","s":["Dân chủ đại diện được thể hiện qua việc ………","Một nguyên tắc cốt lõi của nhà nước pháp quyền là ………","Nhân dân là ……… tối cao trong Nhà nước pháp quyền","Hình thức dân chủ gián tiếp là hình thức ………"],"b":["thượng tôn pháp luật","bầu cử Quốc hội","dân chủ đại diện","chủ thể quyền lực"],"a":[1,0,3,2]},{"id":"b3-30","l":3,"t":"single","q":"Vận dụng những kiến thức đã học, cho biết đâu là quan niệm đúng và đầy đủ về nhà nước xã hội chủ nghĩa ở Việt Nam?","o":["Nhà nước xã hội chủ nghĩa ở Việt Nam là nhà nước không có sự can thiệp của Đảng Cộng sản, với mục tiêu chí là phát triển kinh tế tư nhân và thu hút đầu tư nước ngoài.","Nhà nước xã hội chủ nghĩa ở Việt Nam là nhà nước của nhân dân, do nhân dân và vì nhân dân, dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, nhằm xây dựng xã hội công bằng, dân chủ, văn minh","Nhà nước xã hội chủ nghĩa ở Việt Nam là nhà nước được lãnh đạo bởi tầng lớp tư sản, nhằm thúc đẩy kinh tế thị trường và phát triển các doanh nghiệp tư nhân","Nhà nước xã hội chủ nghĩa ở Việt Nam là nhà nước quân chủ lập hiến, trong đó quyền lực tập trung vào tay một người đứng đầu nhà nước"],"a":[1]},{"id":"b3-31","l":3,"t":"tf","q":"Chọn Đúng hoặc Sai cho từng phát biểu sau:","s":["Trong xã hội tư bản, dân chủ thực chất thuộc về giai cấp tư sản","Dân chủ là một phạm trù mang tính lịch sử, gắn với sự xuất hiện và phát triển của nhà nước","Dân chủ xã hội chủ nghĩa là nền dân chủ cao hơn về chất so với nền dân chủ tư sản","Dân chủ xã hội chủ nghĩa là sự phủ định sạch trơn những thành tựu dân chủ trước đó"],"a":[true,true,true,false]},{"id":"b3-32","l":3,"t":"tf","q":"Chọn Đúng hoặc Sai cho từng phát biểu sau:","s":["Với tư cách là một hình thái nhà nước, một chế độ chính trị thì trong lịch sử nhân loại, cho đến nay có năm nền (chế độ) dân chủ","Dân chủ xã hội chủ nghĩa là công cụ để giai cấp công nhân thực hiện chuyên chính với các giai cấp khác","Nền dân chủ chủ nô, gắn với chế độ chiếm hữu nô lệ.","Dân chủ tư sản là hình thức dân chủ gắn với quyền lực chính trị của giai cấp tư sản"],"a":[false,false,true,true]},{"id":"b3-33","l":3,"t":"tf","q":"Chọn Đúng hoặc Sai cho từng phát biểu sau:","s":["Hình thức dân chủ gián tiếp là hình thức thông qua đó, nhân dân bằng hành động trực tiếp của mình thực hiện quyền làm chủ nhà nước và xã hội","Chế độ dân chủ nhân dân ở nước ta được xác lập sau Cách mạng Tháng Tám năm 1945","Năm 1976, tên nước được đổi thành Cộng hòa xã hội chủ nghĩa Việt Nam","Hình thức dân chủ trực tiếp là hình thức dân chủ đại diện, được thực hiện do nhân dân ủy quyền, giao quyền lực của mình cho tổ chức mà nhân dân trực tiếp bầu ra"],"a":[false,true,true,false]},{"id":"b4-1","l":4,"t":"single","q":"Trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội – giai cấp thường xuyên biến đổi theo mấy quy luật cơ bản?","o":["2","3","4","5"],"a":[1]},{"id":"b4-2","l":4,"t":"single","q":"Xét về mặt kinh tế, trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội – giai cấp biến đổi phức tạp, đa dạng, làm xuất hiện các tầng lớp mới là do:","o":["Tồn tại nhiều giai cấp, tầng lớp","Các giai cấp có nhiều tư liệu sản xuất quyết định","Kinh tế chậm phát triển","Cơ cấu kinh tế đa dạng, phức tạp"],"a":[3]},{"id":"b4-3","l":4,"t":"single","q":"V.I. Lênin đã xem liên minh giữa giai cấp, tầng lớp nào là một hình thức “liên minh đặc biệt” trong giai đoạn giành chính quyền và xây dựng chủ nghĩa xã hội?","o":["Giai cấp công nhân với giai cấp nông dân và tầng lớp trí thức","Giai cấp công nhân với giai cấp nông dân và tầng lớp tiểu tư sản","Giai cấp công nhân với giai cấp nông dân và các tầng lớp xã hội khác","Giai cấp công nh ới tốt. Hạt nhân của xã hội chính là gia đình\"?","o":["Ph. Ăngghen","C. Mác","Hồ Chí Minh","V.I. Lênin"],"a":[2]},{"id":"b6-25","l":6,"t":"multi","q":"Quy mô của gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội có những biến đổi như thế nào?","o":["Gia đình hạt nhân tăng lên","Ngày càng thu nhỏ","Quy mô lớn","Kinh tế tự cấp"],"a":[0,1]}];

  5:"Vấn đề dân tộc và tôn giáo trong thời kỳ quá độ",
  6:"Vấn đề gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội"

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = $("#app");
const store = {
  get(k,d){try{const v=localStorage.getItem("cnxhkh:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("cnxhkh:"+k,JSON.stringify(v))}catch(e){}}
};
const fmt = x => (Math.round(x*10)/10).toLocaleString("vi-VN",{maximumFractionDigits:1});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const range = n => [...Array(n).keys()];

const GROUPS = {
  "123":{l:[1,2,3], name:"Gộp Bài 1, 2, 3", title:"Tổng hợp Bài 1 – 3"},
  "456":{l:[4,5,6], name:"Gộp Bài 4, 5, 6", title:"Tổng hợp Bài 4 – 6"},
  all:{l:[1,2,3,4,5,6], name:"Kiểm tra tất cả các bài (Bài 1 – 6)", title:"Tổng hợp Bài 1 – 6"}
};
const poolOf = k => GROUPS[k] ? DATA.filter(q=>GROUPS[k].l.includes(q.l)) : DATA.filter(q=>q.l===+k);
let cfg = Object.assign({lesson:1, order:"seq", count:"all"}, store.get("cfg",{}));
let S = null; // current test state
let timer = null;

/* ---------------- Home ---------------- */

  clearInterval(timer);
  const best = store.get("best",{});
  const cards = [1,2,3,4,5,6].map(l=>{

  const fixed = DATA.filter(q=>q.n);
  app.innerHTML = `<div class="wrap">
    <header class="masthead">
      <span class="eyebrow">Chủ nghĩa xã hội khoa học · Ngân hàng ${DATA.length} câu</span>

      <p>Bấm vào một bài để chọn cách làm và bắt đầu. Nộp bài để xem điểm theo thang 10 và đáp án những câu làm sai. Đáp án đã được đối chiếu với giáo trình.</p>
    </header>
    <div class="lessons" role="group" aria-label="Chọn bài">${cards}</div>
    <dialog class="setup" id="setup" aria-labelledby="setupTtl"></dialog>

      <ol>${fixed.map(q=>`<li><b>Bài ${q.l}:</b> ${esc(q.q.length>110?q.q.slice(0,110)+"…":q.q)} ${q.t==="match"?"<i>("+esc(q.s.map((s,i)=>q.b[q.a[i]]).join(" · "))+")</i>":""}<br><span class="hint">${esc(q.n)}</span></li>`).join("")}</ol>
    </details>
  </div>`;
  const dlg=$("#setup");
  app.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>{
    cfg.lesson=GROUPS[b.dataset.l]?b.dataset.l:+b.dataset.l; save();
    app.querySelectorAll(".lesson").forEach(x=>x.setAttribute("aria-pressed",x===b));

  });

function setup(){
  const dlg=$("#setup"), k=cfg.lesson, g=GROUPS[k], best=store.get("best",{})[k];
  const total = poolOf(k).length;
  const counts = [20,40,60].filter(c=>c<total);
  if(cfg.count!=="all" && !counts.includes(cfg.count)) cfg.count="all";
  dlg.innerHTML = `<div class="setup-in">
    <div class="setup-head">
      <div><span class="eyebrow">${g?"Tổng hợp":"Bài "+k} · ${total} câu${best!=null?` · cao nhất <span class="best">${fmt(best)} đ</span>`:""}</span>
        <h2 id="setupTtl">${g?g.name:LESSONS[k]}</h2></div>
      <button class="x" id="closeSetup" aria-label="Đóng">×</button>
    </div>
    <div class="field"><span class="eyebrow">Thứ tự câu hỏi và đáp án</span>
      <div class="seg" role="group">
        <button data-order="seq" aria-pressed="${cfg.order==="seq"}">Lần lượt</button>
        <button data-order="rand" aria-pressed="${cfg.order==="rand"}">Xáo trộn</button>
      </div>
      <p class="hint">${cfg.order==="rand"?"Xáo cả thứ tự câu hỏi lẫn thứ tự các phương án trong mỗi câu.":"Giữ nguyên thứ tự câu và phương án như trong tài liệu."}</p>
    </div>
    <div class="field"><span class="eyebrow">Số câu</span>
      <div class="seg" role="group">
        ${counts.map(c=>`<button data-count="${c}" aria-pressed="${cfg.count===c}">${c} câu</button>`).join("")}
        <button data-count="all" aria-pressed="${cfg.count==="all"}">Tất cả (${total})</button>
      </div>
      ${cfg.count!=="all"?`<p class="hint">${cfg.order==="seq"?"Lấy ngẫu nhiên "+cfg.count+" câu rồi xếp theo thứ tự tài liệu.":"Lấy ngẫu nhiên "+cfg.count+" câu."}</p>`:""}
    </div>
    <button class="btn primary big" id="start">Làm bài</button>
  </div>`;
  const again = sel=>{save();setup();const f=dlg.querySelector(sel);if(f) f.focus()};
  dlg.querySelectorAll("[data-order]").forEach(b=>b.onclick=()=>{cfg.order=b.dataset.order;again(`[data-order="${cfg.order}"]`)});
  dlg.querySelectorAll("[data-count]").forEach(b=>b.onclick=()=>{cfg.count=b.dataset.count==="all"?"all":+b.dataset.count;again(`[data-count="${cfg.count}"]`)});
  $("#closeSetup").onclick=()=>dlg.close();
  $("#start").onclick=()=>{dlg.close();start()};
}
function save(){store.set("cfg",cfg)}

/* ---------------- Build a test ---------------- */
function start(ids){
  let pool = ids ? DATA.filter(q=>ids.includes(q.id)) : poolOf(cfg.lesson);
  if(!ids && cfg.count!=="all" && cfg.count<pool.length){
    const pick = new Set(shuffle(pool).slice(0,cfg.count).map(q=>q.id));
    pool = pool.filter(q=>pick.has(q.id));
  }
  const rand = cfg.order==="rand";
  if(rand) pool = shuffle(pool);
  S = {
    title: ids ? "Làm lại các câu sai" : (GROUPS[cfg.lesson]?GROUPS[cfg.lesson].title:"Bài "+cfg.lesson),
    key: ids ? null : String(cfg.lesson),
    items: pool.map(q=>{
      const n = q.o ? q.o.length : q.s.length;
      return {q, ord: rand?shuffle(range(n)):range(n), bank: q.b?(rand?shuffle(range(q.b.length)):range(q.b.length)):null,
              ans: q.t==="single"?null : q.t==="multi"?[] : q.s.map(()=>null)};
    }),
    done:false, t0:Date.now(), confirm:false
  };
  quiz(); window.scrollTo(0,0);
}
const answered = it => it.q.t==="single" ? it.ans!=null : it.q.t==="multi" ? it.ans.length>0 : it.ans.every(v=>v!=null);
const partly = it => Array.isArray(it.ans) && it.q.t!=="multi" && it.ans.some(v=>v!=null) && !answered(it);
function grade(it){
  const q=it.q;
  if(q.t==="single") return it.ans===q.a[0]?1:0;
  if(q.t==="multi") return (it.ans.length===q.a.length && q.a.every(a=>it.ans.includes(a)))?1:0;
  return q.a.filter((a,i)=>it.ans[i]===a).length/q.a.length;
}

/* ---------------- Quiz screen ---------------- */

  const done=S.done;
  app.innerHTML = `
  <div class="bar"><div class="in">
    <button class="btn sm" id="back" aria-label="Chọn bài">←<span class="lbl"> Chọn bài</span></button>
    <span class="ttl">${esc(S.title)}</span>
    <span class="stat" id="stat"></span>
    <button class="btn sm only-m" id="sheetBtn" aria-controls="sheetcol" aria-expanded="false">Phiếu</button>
  </div><div class="progress"><i id="prog"></i></div></div>
  <div class="wrap"><div class="layout">
    <div class="main">
      <div class="qlist ${done?"locked":""}" id="qlist">${S.items.map((it,i)=>qhtml(it,i)).join("")}</div>
      <div class="endbar">${done?`<button class="btn primary big" data-act="result">Xem kết quả</button>`
        :`<p class="hint" id="endStat"></p><button class="btn primary big" data-act="submit">Nộp bài</button><div class="confirmBox"></div>`}</div>

    <aside class="sheetcol" id="sheetcol" aria-label="Phiếu trả lời">

      <div class="grid" id="grid"></div>
      ${done?`<div class="row"><button class="btn" data-act="result">Xem kết quả</button></div>`
            :`<div class="row"><button class="btn primary" data-act="submit">Nộp bài</button></div><div class="confirmBox"></div>`}
    </aside>
  </div></div>
  <div class="scrim" id="scrim"></div>`;
  $("#back").onclick=home;
  app.querySelectorAll("[data-act=result]").forEach(b=>b.onclick=result);
  app.querySelectorAll("[data-act=submit]").forEach(b=>b.onclick=trySubmit);
  $("#sheetBtn").onclick=()=>toggleSheet(true);
  $("#closeSheet").onclick=$("#scrim").onclick=()=>toggleSheet(false);
  bind(); refresh();
  clearInterval(timer);
  if(!done) timer=setInterval(refresh,1000);
}
function qhtml(it,i){
  const q=it.q, done=S.done, g=done?grade(it):null;
  let body="";
  if(q.t==="single"||q.t==="multi"){
    body=`<div class="opts" role="${q.t==="single"?"radiogroup":"group"}">`+it.ord.map((oi,k)=>{
      const sel = q.t==="single"?it.ans===oi:it.ans.includes(oi);
      const cls = ["opt",q.t==="multi"?"multi":"",sel?"sel":"",done&&q.a.includes(oi)?"is-ans":"",done&&sel&&!q.a.includes(oi)?"not-ans":""].join(" ");
      return `<label class="${cls}"><input type="${q.t==="single"?"radio":"checkbox"}" name="q${i}" id="q${i}o${oi}" data-i="${i}" data-o="${oi}" ${sel?"checked":""} ${done?"disabled":""}><span class="bub">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></label>`;
    }).join("")+`</div>`;
  } else {
    body=`<div class="parts">`+it.ord.map(si=>{
      const v=it.ans[si], ok=done&&v===q.a[si];
      let ctl="";
      if(q.t==="tf"){
        ctl=`<span class="tfbtns">${[true,false].map(b=>`<button type="button" data-i="${i}" data-s="${si}" data-v="${b}" aria-pressed="${v===b}" ${done?"disabled":""}>${b?"Đúng":"Sai"}</button>`).join("")}</span>`;
      } else {
        const opts = q.t==="match" ? it.bank.map(bi=>[bi,q.b[bi]]) : q.g.map((g,gi)=>[gi,g]);
        ctl=`<select id="q${i}s${si}" data-i="${i}" data-s="${si}" ${done?"disabled":""}><option value="">— chọn —</option>${opts.map(([k,t])=>`<option value="${k}" ${v===k?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
      }
      const corr = done&&!ok ? `<span class="fix">→ ${esc(q.t==="tf"?(q.a[si]?"Đúng":"Sai"):q.t==="match"?q.b[q.a[si]]:q.g[q.a[si]])}</span>`:"";
      return `<div class="part ${done?(ok?"ok":"no"):""}"><span>${esc(q.s[si])}</span><span class="row">${ctl}${corr}</span></div>`;
    }).join("")+`</div>`;
  }
  const scoreTag = done ? `<span class="tag" style="color:var(${g===1?"--ok":"--pen"})">${g===1?"Đúng":g>0?"Đúng "+Math.round(g*q.a.length)+"/"+q.a.length:"Sai"}</span>`:"";
  return `<article class="q ${done?(g===1?"right":"wrong"):""}" id="card${i}">
    <div class="qhead"><span class="qno">Câu ${i+1}.</span><span class="qtext">${esc(q.q)}${scoreTag}</span></div>
    ${body}${done&&q.n?`<div class="note">${esc(q.n)}</div>`:""}</article>`;
}
function bind(){
  const list=$("#qlist");
  list.addEventListener("change",e=>{
    const t=e.target, it=S.items[+t.dataset.i]; if(!it||S.done) return;
    if(t.type==="radio"){ it.ans=+t.dataset.o; }
    else if(t.type==="checkbox"){ const o=+t.dataset.o; it.ans=t.checked?[...new Set([...it.ans,o])]:it.ans.filter(x=>x!==o); }
    else if(t.tagName==="SELECT"){ it.ans[+t.dataset.s]=t.value===""?null:+t.value; }
    rerender(+t.dataset.i);
  });
  list.addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b||S.done) return;
    const it=S.items[+b.dataset.i]; it.ans[+b.dataset.s]=b.dataset.v==="true";
    rerender(+b.dataset.i);
  });
}
function rerender(i){
  const old=$("#card"+i), focusId=document.activeElement&&document.activeElement.id;
  const tmp=document.createElement("div"); tmp.innerHTML=qhtml(S.items[i],i);
  old.replaceWith(tmp.firstElementChild);
  if(focusId){const f=document.getElementById(focusId); if(f) f.focus({preventScroll:true});}
  S.confirm=false; refresh();
}
function refresh(){
  const n=S.items.length, a=S.items.filter(answered).length;
  const sec=Math.floor(((S.done?S.t1:Date.now())-S.t0)/1000);
  $("#stat").textContent=`${a}/${n} câu · ${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
  $("#prog").style.width=(a/n*100)+"%";
  $("#grid").innerHTML=S.items.map((it,i)=>{
    let c = S.done ? (grade(it)===1?"r":"w") : answered(it)?"done":partly(it)?"half":"";
    return `<button class="cell ${c}" data-go="${i}" aria-label="Câu ${i+1}">${i+1}</button>`;
  }).join("");
  $("#grid").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    toggleSheet(false);
    $("#card"+b.dataset.go).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
  });
  const left=n-a, end=$("#endStat");
  if(end) end.textContent = left ? `Đã làm ${a}/${n} câu · còn ${left} câu chưa làm` : `Đã làm hết ${n} câu`;
  app.querySelectorAll(".confirmBox").forEach(box=>{
    box.innerHTML = S.confirm ? `<div class="confirm"><span>Còn <b>${left}</b> câu chưa làm xong. Câu bỏ trống tính 0 điểm.</span>
      <div class="row"><button class="btn danger" data-act="yes">Vẫn nộp bài</button><button class="btn" data-act="no">Làm tiếp</button></div></div>` : "";
    if(S.confirm){box.querySelector("[data-act=yes]").onclick=submit;box.querySelector("[data-act=no]").onclick=()=>{S.confirm=false;refresh()};}
  });
}
function toggleSheet(open){
  const sc=$("#sheetcol"); if(!sc) return;
  sc.classList.toggle("open",open); $("#scrim").classList.toggle("open",open);
  $("#sheetBtn").setAttribute("aria-expanded",open);
}
function trySubmit(e){
  const left=S.items.filter(it=>!answered(it)).length;
  if(left>0 && !S.confirm){
    S.confirm=true; refresh();
    const box=e&&e.currentTarget.closest(".endbar,.sheetcol").querySelector(".confirmBox");
    if(box) box.scrollIntoView({block:"nearest",behavior:"smooth"});
    return;
  }
  submit();
}
function submit(){
  clearInterval(timer);
  S.done=true; S.t1=Date.now();
  const pts=S.items.reduce((s,it)=>s+grade(it),0);
  S.score=pts/S.items.length*10;
  if(S.key && S.items.length===poolOf(S.key).length){
    const best=store.get("best",{}); if(best[S.key]==null||S.score>best[S.key]){best[S.key]=S.score;store.set("best",best)}
  }
  S.filter="wrong";
  result();
}

/* ---------------- Result screen ---------------- */
function result(){
  window.scrollTo(0,0);
  const n=S.items.length, right=S.items.filter(it=>grade(it)===1).length, wrong=S.items.filter(it=>grade(it)<1);
  const sec=Math.floor((S.t1-S.t0)/1000);
  const msg = S.score>=9?"Rất tốt!":S.score>=7?"Khá tốt, ôn lại vài câu sai nữa là chắc.":S.score>=5?"Đạt. Xem kỹ các câu sai bên dưới.":"Cần ôn thêm. Xem đáp án các câu sai bên dưới.";
  const shown = S.items.map((it,i)=>[it,i]).filter(([it])=>S.filter==="all"||grade(it)<1);
  app.innerHTML=`<div class="wrap">
    <section class="result">
      <div class="score" aria-label="Điểm"><div><b>${fmt(S.score)}</b><br><span>/ 10 điểm</span></div></div>
      <div>
        <span class="eyebrow">${esc(S.title)}</span>
        <h2>${msg}</h2>
        <div class="stats">
          <div><b>${right}/${n}</b><small>câu đúng hoàn toàn</small></div>
          <div><b>${wrong.length}</b><small>câu sai hoặc đúng một phần</small></div>
          <div><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</b><small>thời gian làm bài</small></div>
        </div>
        <div class="row">
          ${wrong.length?`<button class="btn primary" id="redoWrong">Làm lại ${wrong.length} câu sai</button>`:""}
          <button class="btn" id="redo">Làm lại từ đầu</button>
          <button class="btn" id="sheet">Xem phiếu đã chấm</button>
          <button class="btn" id="homeBtn">Chọn bài khác</button>
        </div>
      </div>
    </section>
    <div class="seg filter" role="group">
      <button data-f="wrong" aria-pressed="${S.filter==="wrong"}">Câu làm sai (${wrong.length})</button>
      <button data-f="all" aria-pressed="${S.filter==="all"}">Tất cả câu (${n})</button>
    </div>
    <div class="qlist locked">${shown.length?shown.map(([it,i])=>qhtml(it,i)).join(""):`<div class="empty">Bạn không sai câu nào. Đáp án đúng được tô xanh khi chọn "Tất cả câu".</div>`}</div>
  </div>`;
  const redoIds=wrong.map(it=>it.q.id);
  if(wrong.length) $("#redoWrong").onclick=()=>start(redoIds);
  $("#redo").onclick=()=>{ if(S.key) start(); else start(S.items.map(it=>it.q.id)); };
  $("#sheet").onclick=quiz;
  $("#homeBtn").onclick=home;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;result()});
}

/* ---------------- Theme ---------------- */
const sysDark = matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){
  const t = store.get("theme", null);
  if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t==="dark" : sysDark.matches;
  document.documentElement.classList.toggle("is-dark", dark);
  const b = $("#theme");
  b.setAttribute("aria-label", dark ? "Chuyển sang nền sáng" : "Chuyển sang nền tối");
  b.title = b.getAttribute("aria-label");
}
$("#theme").onclick = ()=>{
  store.set("theme", document.documentElement.classList.contains("is-dark") ? "light" : "dark");
  applyTheme();
};
sysDark.addEventListener("change", applyTheme);
applyTheme();

home();
</script>
